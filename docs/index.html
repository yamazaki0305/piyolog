<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ぴよログ 応援デモ</title>
<style>
  :root {
    --bg: #faf7f2;
    --card: #ffffff;
    --text: #2f2a26;
    --muted: #8a8178;
    --line: #eae3d9;
    --accent: #e8913a;
    --accent-text: #ffffff;
    --kuma: #f3e4d0;
    --usagi: #fde3ea;
    --error: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1c19;
      --card: #2a2622;
      --text: #f0ebe4;
      --muted: #a39a90;
      --line: #3a352f;
      --kuma: #4a3b2a;
      --usagi: #4d3039;
      --error: #ff7a6b;
    }
  }
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 16px 64px;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.6;
  }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 24px; }
  section {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px 18px; margin-bottom: 16px;
  }
  details summary { cursor: pointer; font-size: 14px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  input, select {
    width: 100%; padding: 8px 10px; font-size: 13px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--text); font-family: ui-monospace, monospace;
  }
  #profile input, #profile select { font-family: inherit; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0 14px; }
  button#load {
    width: 100%; padding: 14px; font-size: 16px; font-weight: 600;
    border: 0; border-radius: 10px; cursor: pointer;
    background: var(--accent); color: var(--accent-text);
  }
  button#load:disabled { opacity: .6; cursor: wait; }
  .status { font-size: 13px; color: var(--muted); margin: 10px 0 0; min-height: 1.4em; }
  .error { color: var(--error); white-space: pre-wrap; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 500; }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.time { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
  td.type { white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip { background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
  .scroll { max-height: 320px; overflow-y: auto; }
  .bubble-row { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 12px; }
  .avatar { font-size: 32px; line-height: 1; }
  .bubble { padding: 10px 14px; border-radius: 14px; max-width: 85%; }
  .bubble.kuma { background: var(--kuma); }
  .bubble.usagi { background: var(--usagi); }
  .name { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .trivia { display: grid; gap: 10px; margin-top: 16px; }
  .trivia-card { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--bg); }
  .trivia-label { display: inline-block; font-size: 12px; font-weight: 600; color: #fff; background: #d98a8a; border-radius: 6px; padding: 2px 8px; margin-bottom: 6px; }
  .trivia-card.kuma .trivia-label { background: #a98258; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>ぴよログ 応援デモ</h1>
  <p class="sub">記録を読み込み → くまとうさぎが応援メッセージを作ります</p>

  <section>
    <details id="settings">
      <summary>接続設定（Supabase）</summary>
      <label for="url">Project URL</label>
      <input id="url" placeholder="https://xxxx.supabase.co" autocomplete="off">
      <label for="key">anon key（公開キー）</label>
      <input id="key" placeholder="eyJ..." autocomplete="off">
      <p class="sub" style="margin:8px 0 0">このブラウザ内（localStorage）にだけ保存されます。</p>
    </details>
  </section>

  <section id="profile">
    <h2>基本設定（赤ちゃん）</h2>
    <div class="grid">
      <div>
        <label for="baby-name">名前</label>
        <input id="baby-name" maxlength="20" placeholder="例: はると" autocomplete="off">
      </div>
      <div>
        <label for="birth">生年月日</label>
        <input id="birth" type="date">
      </div>
      <div>
        <label for="gender">性別</label>
        <select id="gender">
          <option value="">選ばない</option>
          <option value="boy">男の子</option>
          <option value="girl">女の子</option>
        </select>
      </div>
      <div>
        <label for="caller">親への呼びかけ</label>
        <select id="caller">
          <option value="">呼びかけない</option>
          <option value="mama">ママ</option>
          <option value="papa">パパ</option>
        </select>
      </div>
    </div>
    <p class="sub" id="age" style="margin:10px 0 0; font-size:14px"></p>
    <p class="sub" style="margin:6px 0 0">名前・生年月日は、このブラウザにだけ保存されます。応援メッセージを作るとき、名前・月齢・性別・呼びかけが AI（OpenAI）に送られます（生年月日そのものは送りません）。</p>
  </section>

  <button id="load">ぴよログ読み込み</button>
  <p class="status" id="status"></p>

  <section id="records-box" hidden>
    <h2>① ぴよログの記録 <span id="range" class="sub"></span></h2>
    <div class="chips" id="chips"></div>
    <div class="scroll">
      <table>
        <thead><tr><th>時刻</th><th>種類</th><th>内容</th></tr></thead>
        <tbody id="records"></tbody>
      </table>
    </div>
  </section>

  <section id="serifu-box" hidden>
    <h2>② 応援メッセージ</h2>
    <div id="serifu"></div>
    <div class="trivia" id="trivia"></div>
    <p class="sub" id="usage" style="margin:12px 0 0"></p>
    <details style="margin-top:8px">
      <summary>LLMに渡した情報（確認用）</summary>
      <pre id="summary" style="font-size:12px; overflow:auto"></pre>
    </details>
  </section>
  <p class="sub" style="margin-top:24px"><a href="eval.html">会話の品質チェック（開発用）</a></p>
</main>

<script>
const $ = (id) => document.getElementById(id);

// Edge Function の URL 上の名前（slug）。ダッシュボードの関数一覧で表示名と違うことがある
const FN_FETCH = "quick-function";      // 表示名: fetch-piyolog
const FN_SERIFU = "generate-serifu";
const JPY_PER_USD = 155;   // 金額表示の円換算レート（概算）

const TYPE_LABEL = {
  Formula: "ミルク", BreastFeeding: "母乳", ExpressedBreastMilk: "搾母乳", Pumping: "搾乳",
  Drink: "のみもの", Temperature: "体温", Height: "身長", Weight: "体重", Head: "頭囲",
  Chest: "胸囲", Foot: "足サイズ", Poop: "うんち", Sleep: "寝る", WakeUp: "起きる",
  Pee: "おしっこ", Solid: "離乳食", Snack: "おやつ", Meal: "ごはん",
};
const TRIVIA_LABEL = { usagi: "🐰 うさぎの豆知識", kuma: "🐻 くまの豆知識" };
const CHARACTERS = {
  kuma:  { emoji: "🐻", name: "くま" },
  usagi: { emoji: "🐰", name: "うさぎ" },
};

const fmt = new Intl.DateTimeFormat("ja-JP", {
  timeZone: "Asia/Tokyo", month: "numeric", day: "numeric",
  hour: "2-digit", minute: "2-digit", hour12: false,
});

// value は数値、または {value, unit} のどちらでも読む
const num = (v) => typeof v === "number" ? v
  : (v && typeof v === "object" && "value" in v) ? num(v.value) : null;

function detail(r) {
  const parts = [];
  const v = num(r.value);
  const unit = { Formula: "ml", ExpressedBreastMilk: "ml", Pumping: "ml", Drink: "ml",
    Temperature: "℃", Weight: "kg", Height: "cm", Head: "cm", Chest: "cm" }[r.type];
  if (v !== null && unit) parts.push(`${v}${unit}`);
  if (r.type === "BreastFeeding") {
    const l = num(r.leftTime), rt = num(r.rightTime);
    if (l !== null) parts.push(`左 ${Math.round(l / 60)}分`);
    if (rt !== null) parts.push(`右 ${Math.round(rt / 60)}分`);
  }
  if (r.type === "Poop" && r.details) parts.push(JSON.stringify(r.details));
  if (r.memo) parts.push(`📝 ${r.memo}`);
  return parts.join("　");
}

// 月齢（満月数 + 端数の日数）。関数側（generate-serifu）と同じ計算。表示用
const jstDate = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Tokyo" }); // YYYY-MM-DD

function ageFrom(birth, today) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(birth);
  if (!m) return null;
  const [by, bm, bd] = [Number(m[1]), Number(m[2]), Number(m[3])];
  if (bm < 1 || bm > 12 || new Date(Date.UTC(by, bm - 1, bd)).getUTCDate() !== bd) return null;
  const [ty, tm, td] = today.split("-").map(Number);
  let months = (ty - by) * 12 + (tm - bm);
  if (td < bd) months--;
  if (months < 0) return null;
  const ay = by + Math.floor((bm - 1 + months) / 12);
  const am = ((bm - 1 + months) % 12) + 1;
  const ad = Math.min(bd, new Date(Date.UTC(ay, am, 0)).getUTCDate());
  const days = Math.round((Date.UTC(ty, tm - 1, td) - Date.UTC(ay, am - 1, ad)) / 86400000);
  return { months, days };
}
function ageLabel(a) {
  if (a.months === 0) return `生後${a.days}日`;
  if (a.months < 12) return `生後${a.months}か月${a.days}日`;
  return `${Math.floor(a.months / 12)}歳${a.months % 12}か月`;
}

// 基本設定（赤ちゃん）の保存/復元
const PROFILE_KEY = "piyolog.profile";

function currentProfile() {
  return { name: $("baby-name").value.trim(), birth_date: $("birth").value, gender: $("gender").value, caller: $("caller").value };
}
function updateAge() {
  const birth = $("birth").value;
  const a = birth ? ageFrom(birth, jstDate.format(new Date())) : null;
  $("age").textContent = a ? `月齢: ${ageLabel(a)}` : (birth ? "生年月日が正しくありません（未来の日付など）" : "");
}
function saveProfile() {
  try { localStorage.setItem(PROFILE_KEY, JSON.stringify(currentProfile())); } catch {}
  updateAge();
}
function loadProfile() {
  try {
    const p = JSON.parse(localStorage.getItem(PROFILE_KEY) ?? "{}");
    $("baby-name").value = p.name ?? "";
    $("birth").value = p.birth_date ?? "";
    $("gender").value = p.gender ?? "";
    $("caller").value = p.caller ?? "";
  } catch {}
  updateAge();
}
for (const id of ["baby-name", "birth", "gender", "caller"]) $(id).addEventListener("input", saveProfile);

// 設定の保存/復元（localStorageが使えない環境でも動くようにtry/catch）
function loadSettings() {
  try {
    $("url").value = localStorage.getItem("piyolog.url") ?? "";
    $("key").value = localStorage.getItem("piyolog.key") ?? "";
  } catch {}
  if (!$("url").value || !$("key").value) $("settings").open = true;
}
function saveSettings() {
  try {
    localStorage.setItem("piyolog.url", $("url").value.trim());
    localStorage.setItem("piyolog.key", $("key").value.trim());
  } catch {}
}

async function callFunction(name, body) {
  const base = $("url").value.trim().replace(/\/$/, "");
  const key = $("key").value.trim();
  const endpoint = `${base}/functions/v1/${name}`;
  let res;
  try {
    res = await fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${key}`, apikey: key },
      body: JSON.stringify(body ?? {}),
    });
  } catch (e) {
    // 関数が存在しない(404)・CORSエラー・ネット切断は、ブラウザ上どれも同じ「Failed to fetch」になる
    throw new Error(`${endpoint}\nに接続できませんでした（${e.message}）\n関数名・デプロイ状況・ネット接続を確認してください`);
  }
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch { data = null; }
  if (!res.ok || !data || data.ok === false) {
    throw new Error(`${name} (HTTP ${res.status})\n${data?.error ?? text}`);
  }
  return data;
}

function setStatus(msg, isError = false) {
  const el = $("status");
  el.textContent = msg;
  el.className = "status" + (isError ? " error" : "");
}

function renderRecords(data) {
  const records = [...data.records].sort((a, b) => b.datetime.localeCompare(a.datetime));

  const counts = {};
  for (const r of records) counts[r.type] = (counts[r.type] ?? 0) + 1;
  $("chips").replaceChildren(...Object.entries(counts).map(([t, n]) => {
    const c = document.createElement("span");
    c.className = "chip";
    c.textContent = `${TYPE_LABEL[t] ?? t} ${n}`;
    return c;
  }));

  $("range").textContent = data.range
    ? `${fmt.format(new Date(data.range.from))} 〜 ${fmt.format(new Date(data.range.to))}（${records.length}件）`
    : `${records.length}件`;

  $("records").replaceChildren(...records.map((r) => {
    const tr = document.createElement("tr");
    for (const [cls, text] of [
      ["time", fmt.format(new Date(r.datetime))],
      ["type", TYPE_LABEL[r.type] ?? r.type],
      ["", detail(r)],
    ]) {
      const td = document.createElement("td");
      if (cls) td.className = cls;
      td.textContent = text;   // 記録のメモ等はユーザー入力なので textContent で入れる
      tr.append(td);
    }
    return tr;
  }));
  $("records-box").hidden = false;
}

// 今回の生成で使ったトークン数と概算金額（関数が OpenAI の使用量から計算して返す）
function renderUsage(u, guard) {
  const el = $("usage");
  if (!u) { el.textContent = ""; return; }
  const n = (v) => v.toLocaleString("ja-JP");
  const cached = u.cached_input_tokens ? `（うちキャッシュ ${n(u.cached_input_tokens)}）` : "";
  const cost = u.cost_usd == null
    ? "金額は不明（料金表にないモデル）"
    : `約 $${u.cost_usd.toFixed(4)}（約 ${(u.cost_usd * JPY_PER_USD).toFixed(2)} 円）`;
  const check = guard?.retried
    ? `　※数字チェックで記録にない数字が見つかり、作り直しました${guard.dropped ? `（それでも残った${guard.dropped}個のセリフは外しました）` : ""}`
    : "";
  el.textContent = `今回の生成（${u.model}）: 入力 ${n(u.input_tokens)}${cached} ＋ 出力 ${n(u.output_tokens)} トークン → ${cost}　※1ドル=${JPY_PER_USD}円換算${check}`;
}

// 会話とは別に出す、動物の豆知識カード
function renderTrivia(items) {
  $("trivia").replaceChildren(...(items ?? []).map((t) => {
    const card = document.createElement("div");
    card.className = `trivia-card ${t.animal}`;
    const label = document.createElement("div");
    label.className = "trivia-label";
    label.textContent = TRIVIA_LABEL[t.animal] ?? "豆知識";
    const text = document.createElement("div");
    text.textContent = t.text;
    card.append(label, text);
    return card;
  }));
}

function renderSerifu(data) {
  renderTrivia(data.trivia);
  renderUsage(data.usage, data.guard);
  $("serifu").replaceChildren(...data.lines.map((l) => {
    const ch = CHARACTERS[l.speaker] ?? { emoji: "💬", name: l.speaker };
    const row = document.createElement("div");
    row.className = "bubble-row";
    const av = document.createElement("div");
    av.className = "avatar";
    av.textContent = ch.emoji;
    const wrap = document.createElement("div");
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = ch.name;
    const bubble = document.createElement("div");
    bubble.className = `bubble ${l.speaker}`;
    bubble.textContent = l.text;
    wrap.append(name, bubble);
    row.append(av, wrap);
    return row;
  }));
  $("summary").textContent = JSON.stringify({ profile: data.profile, summary: data.summary, guard: data.guard }, null, 2);
  $("serifu-box").hidden = false;
}

$("load").addEventListener("click", async () => {
  saveSettings();
  if (!$("url").value.trim() || !$("key").value.trim()) {
    $("settings").open = true;
    setStatus("Project URL と anon key を入力してください", true);
    return;
  }
  if (!/^https:\/\/[a-z0-9]+\.supabase\.co\/?$/.test($("url").value.trim())) {
    $("settings").open = true;
    setStatus("Project URL は https://xxxx.supabase.co の形で入力してください（ぴよログのURLや、=を含む行ではありません）", true);
    return;
  }
  if (!/^eyJ[\w-]+\.[\w-]+\.[\w-]+$/.test($("key").value.trim())) {
    $("settings").open = true;
    setStatus("anon key は eyJ から始まる長い1つの文字列です（Settings > API Keys > Legacy anon, service_role API keys タブ）", true);
    return;
  }
  $("load").disabled = true;
  $("records-box").hidden = true;
  $("serifu-box").hidden = true;

  try {
    setStatus("ぴよログを読み込み中…");
    const feed = await callFunction(FN_FETCH);
    renderRecords(feed);

    setStatus("くまとうさぎがメッセージを考え中…（数秒かかります）");
    const serifu = await callFunction(FN_SERIFU, { profile: currentProfile() });
    renderSerifu(serifu);
    setStatus("");
  } catch (e) {
    setStatus(String(e.message ?? e), true);
  } finally {
    $("load").disabled = false;
  }
});

loadSettings();
loadProfile();
</script>
</body>
</html>
